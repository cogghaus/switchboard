name: Validate against the newest Claude Code

# Not a required check. It shows whether the newest CLI disagrees with the pin in ci.yml (a changed report
# shape, a new warning, a changed type) before the pin is moved. A failure opens nothing: the signal is
# GitHub's default Actions notification and the red run in the Actions tab.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-latest
  cancel-in-progress: false

jobs:
  validate-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"
      DISABLE_ERROR_REPORTING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install Claude Code (latest)
        run: npm install -g "@anthropic-ai/claude-code@latest"
      - name: Plugin validate (every plugin, warnings against the allow-list)
        run: node .github/drift/validate-gate.mjs
      - name: Crew mod tests
        run: claude plugin test crew
